<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Center — SUNNDARI Admin</title>
<style>
  :root {
    --ground: #fbf9f7;
    --surface: #ffffff;
    --surface-2: #f4f0ed;
    --ink: #221c22;
    --ink-soft: #6b6069;
    --ink-faint: #9c9195;
    --line: #e7e0dc;
    --accent: #a23b5c;
    --accent-soft: #f6e4ea;
    --open: #a5710f;
    --open-soft: #fbf0dc;
    --running: #2c6e68;
    --running-soft: #e1efec;
    --closed: #8a8286;
    --closed-soft: #ecebe9;
    --danger: #b23a34;
    --font: -apple-system, "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14.5px;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
  ::selection { background: var(--accent-soft); }

  /* ── Login screen ─────────────────────────────────────── */
  #login-screen {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 28px;
  }
  .login-card h1 {
    font-size: 19px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .login-card p.sub {
    margin: 0 0 22px;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: var(--ground);
    color: var(--ink);
  }
  .field input:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .btn-primary {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    margin-top: 4px;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }
  .form-error {
    color: var(--danger);
    font-size: 12.5px;
    margin-top: 12px;
    min-height: 1em;
  }

  /* ── App shell ────────────────────────────────────────── */
  #app-screen { display: none; height: 100%; flex-direction: column; }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-shrink: 0;
  }
  header.topbar .brand { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; }
  header.topbar .brand span { color: var(--accent); }
  header.topbar .who { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--ink-soft); }
  header.topbar button.logout {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 12.5px;
  }
  header.topbar button.logout:hover { color: var(--ink); border-color: var(--ink-faint); }

  .layout { flex: 1; display: flex; min-height: 0; }

  /* ── Sidebar ──────────────────────────────────────────── */
  aside.sidebar {
    width: 300px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .tabs button {
    flex: 1;
    border: none;
    background: none;
    padding: 11px 4px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-faint);
    border-bottom: 2px solid transparent;
  }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs button:hover:not(.active) { color: var(--ink-soft); }

  .conv-list { flex: 1; overflow-y: auto; }
  .conv-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .conv-item:hover { background: var(--surface-2); }
  .conv-item.selected { background: var(--accent-soft); }
  .conv-item .row1 { display: flex; align-items: center; justify-content: space-between; }
  .conv-item .customer { font-weight: 600; font-size: 13.5px; }
  .conv-item .meta { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); }
  .empty-state { padding: 28px 16px; color: var(--ink-faint); font-size: 13px; text-align: center; }

  .pill {
    display: inline-flex;
    align-items: center;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .pill.open { background: var(--open-soft); color: var(--open); }
  .pill.running { background: var(--running-soft); color: var(--running); }
  .pill.closed { background: var(--closed-soft); color: var(--closed); }

  /* ── Thread pane ──────────────────────────────────────── */
  main.thread { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .thread-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
    font-size: 13.5px;
  }
  .thread-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-shrink: 0;
  }
  .thread-head .title { font-weight: 700; font-size: 14.5px; }
  .thread-head .close-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--danger);
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .thread-head .close-btn:hover { background: #fbe6e4; }
  .thread-head .close-btn:disabled { opacity: 0.5; cursor: default; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 62%; display: flex; flex-direction: column; gap: 3px; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.theirs { align-self: flex-start; align-items: flex-start; }
  .msg .bubble {
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 13.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.mine .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.theirs .bubble { background: var(--surface-2); color: var(--ink); border-bottom-left-radius: 4px; }
  .msg .ts { font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); }

  .composer {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    flex-shrink: 0;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 13.5px;
    height: 42px;
    max-height: 120px;
    background: var(--ground);
    color: var(--ink);
  }
  .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .composer button.send {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 0 18px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13.5px;
  }
  .composer button.send:hover { filter: brightness(1.08); }
  .composer button.send:disabled { opacity: 0.5; cursor: default; }
  .closed-banner {
    padding: 10px 20px;
    background: var(--closed-soft);
    color: var(--ink-soft);
    font-size: 12.5px;
    text-align: center;
    border-top: 1px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

  <!-- ── Login ─────────────────────────────────────────── -->
  <div id="login-screen">
    <form class="login-card" id="login-form">
      <h1>Help Center</h1>
      <p class="sub">Admin sign-in — SUNNDARI</p>
      <div class="field">
        <label for="login-username">Phone or email</label>
        <input id="login-username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-primary" type="submit" id="login-submit">Sign in</button>
      <div class="form-error" id="login-error"></div>
    </form>
  </div>

  <!-- ── App ───────────────────────────────────────────── -->
  <div id="app-screen">
    <header class="topbar">
      <div class="brand">SUNNDARI <span>Help Center</span></div>
      <div class="who">
        <span id="who-name"></span>
        <button class="logout" id="logout-btn">Sign out</button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="tabs">
          <button data-status="open" class="active">Open</button>
          <button data-status="running">Running</button>
          <button data-status="closed">Closed</button>
        </div>
        <div class="conv-list" id="conv-list">
          <div class="empty-state">Loading…</div>
        </div>
      </aside>
      <main class="thread" id="thread-pane">
        <div class="thread-empty">Select a conversation</div>
      </main>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'sundari_admin_token';
  var NAME_KEY = 'sundari_admin_name';
  var CONV_POLL_MS = 8000;
  var MSG_POLL_MS = 4000;

  var state = {
    token: localStorage.getItem(TOKEN_KEY) || null,
    status: 'open',
    conversations: [],
    selectedId: null,
    messages: [],
    convTimer: null,
    msgTimer: null,
  };

  // ── API helper ──────────────────────────────────────────

  function api(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch(path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (res) {
      return res.json().then(function (data) {
        if (res.status === 401) {
          logout();
          throw new Error('Session expired');
        }
        if (!data.status) {
          throw new Error(data.message || 'Request failed');
        }
        return data.data;
      });
    });
  }

  // ── Login / logout ──────────────────────────────────────

  var loginForm = document.getElementById('login-form');
  var loginError = document.getElementById('login-error');
  var loginSubmit = document.getElementById('login-submit');

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginError.textContent = '';
    loginSubmit.disabled = true;
    var username = document.getElementById('login-username').value.trim();
    var password = document.getElementById('login-password').value;

    fetch('/auth/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password }),
    })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (!r.ok || !r.d.status) {
          throw new Error((r.d && r.d.message) || 'Login failed');
        }
        if (r.d.data.role !== 'admin') {
          throw new Error('This account is not an admin — Help Center is admin-only.');
        }
        state.token = r.d.data.access_token;
        localStorage.setItem(TOKEN_KEY, state.token);
        localStorage.setItem(NAME_KEY, r.d.data.name || username);
        enterApp();
      })
      .catch(function (err) { loginError.textContent = err.message; })
      .finally(function () { loginSubmit.disabled = false; });
  });

  document.getElementById('logout-btn').addEventListener('click', logout);

  function logout() {
    state.token = null;
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(NAME_KEY);
    clearInterval(state.convTimer);
    clearInterval(state.msgTimer);
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }

  function enterApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    document.getElementById('who-name').textContent = localStorage.getItem(NAME_KEY) || '';
    loadConversations();
    state.convTimer = setInterval(loadConversations, CONV_POLL_MS);
  }

  // ── Conversations list ──────────────────────────────────

  var tabButtons = document.querySelectorAll('.tabs button');
  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabButtons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.status = btn.dataset.status;
      state.selectedId = null;
      renderThread();
      loadConversations();
    });
  });

  function loadConversations() {
    api('/help_center/admin/conversations/get_all/?status=' + state.status + '&limit=50&sort_by=created_at&sort_order=desc')
      .then(function (data) {
        state.conversations = data.data || [];
        renderConvList();
      })
      .catch(function () { /* transient poll failure — next tick retries */ });
  }

  function renderConvList() {
    var el = document.getElementById('conv-list');
    if (!state.conversations.length) {
      el.innerHTML = '<div class="empty-state">No ' + state.status + ' conversations</div>';
      return;
    }
    el.innerHTML = '';
    state.conversations.forEach(function (c) {
      var item = document.createElement('div');
      item.className = 'conv-item' + (c.conversationId === state.selectedId ? ' selected' : '');
      var when = new Date(c.createdAt);
      item.innerHTML =
        '<div class="row1"><span class="customer">Customer #' + c.customerId + '</span>' +
        '<span class="pill ' + c.status + '">' + c.status + '</span></div>' +
        '<span class="meta">#' + c.conversationId + ' · ' + when.toLocaleString() + '</span>';
      item.addEventListener('click', function () { selectConversation(c); });
      el.appendChild(item);
    });
  }

  function selectConversation(c) {
    state.selectedId = c.conversationId;
    state.selectedStatus = c.status;
    state.selectedCustomerId = c.customerId;
    renderConvList();
    renderThread();
    loadMessages(true);
    clearInterval(state.msgTimer);
    state.msgTimer = setInterval(function () { loadMessages(false); }, MSG_POLL_MS);
  }

  // ── Thread pane ──────────────────────────────────────────

  function renderThread() {
    var pane = document.getElementById('thread-pane');
    if (!state.selectedId) {
      pane.innerHTML = '<div class="thread-empty">Select a conversation</div>';
      return;
    }
    pane.innerHTML =
      '<div class="thread-head">' +
        '<span class="title">Customer #' + state.selectedCustomerId + ' — #' + state.selectedId + '</span>' +
        '<button class="close-btn" id="close-conv-btn"' + (state.selectedStatus === 'closed' ? ' disabled' : '') + '>Close conversation</button>' +
      '</div>' +
      '<div class="messages" id="messages"></div>' +
      (state.selectedStatus === 'closed'
        ? '<div class="closed-banner">This conversation is closed — read-only.</div>'
        : '<div class="composer"><textarea id="reply-box" placeholder="Reply to customer…"></textarea><button class="send" id="send-btn">Send</button></div>');

    var closeBtn = document.getElementById('close-conv-btn');
    if (closeBtn) closeBtn.addEventListener('click', closeConversation);

    var sendBtn = document.getElementById('send-btn');
    if (sendBtn) {
      sendBtn.addEventListener('click', sendReply);
      var box = document.getElementById('reply-box');
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
      });
    }
    renderMessages();
  }

  function loadMessages(scrollToBottom) {
    if (!state.selectedId) return;
    api('/help_center/admin/messages/get_all/?conversation_id=' + state.selectedId + '&limit=200&sort_order=asc')
      .then(function (data) {
        state.messages = (data.data || []);
        renderMessages(scrollToBottom);
      })
      .catch(function () { /* transient poll failure — next tick retries */ });
  }

  function renderMessages(scrollToBottom) {
    var el = document.getElementById('messages');
    if (!el) return;
    var wasNearBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;

    el.innerHTML = '';
    state.messages.forEach(function (m) {
      var mine = m.senderId !== state.selectedCustomerId;
      var row = document.createElement('div');
      row.className = 'msg ' + (mine ? 'mine' : 'theirs');
      var ts = new Date(m.createdAt);
      row.innerHTML =
        '<div class="bubble"></div>' +
        '<span class="ts">' + ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</span>';
      row.querySelector('.bubble').textContent = m.content;
      el.appendChild(row);
    });

    if (scrollToBottom || wasNearBottom) el.scrollTop = el.scrollHeight;
  }

  function sendReply() {
    var box = document.getElementById('reply-box');
    var content = box.value.trim();
    if (!content) return;
    var sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;
    api('/help_center/admin/messages/create/', {
      method: 'POST',
      body: { conversation_id: state.selectedId, content: content },
    })
      .then(function () {
        box.value = '';
        loadMessages(true);
        loadConversations();
      })
      .catch(function (err) { alert(err.message); })
      .finally(function () { sendBtn.disabled = false; });
  }

  function closeConversation() {
    if (!confirm('Close this conversation? The customer will need to start a new one to reach support again.')) return;
    api('/help_center/admin/conversation/close/', {
      method: 'POST',
      body: { conversation_id: state.selectedId },
    })
      .then(function () {
        state.selectedStatus = 'closed';
        renderThread();
        loadConversations();
      })
      .catch(function (err) { alert(err.message); });
  }

  // ── Boot ─────────────────────────────────────────────────

  if (state.token) enterApp();
})();
</script>
</body>
</html>
